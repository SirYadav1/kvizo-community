<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">

<style>
  :root {
    --bg: #ffffff;
    --fg: #17151f;
    --muted: #5d5a6b;
    --card: #f6f5fb;
    --border: #e6e3f2;
    --accent: #7c3aed;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0d13;
      --fg: #f4f3f8;
      --muted: #a5a1b4;
      --card: #17151f;
      --border: #29263a;
      --accent: #a78bfa;

    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--fg);
    font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  .card {
    max-width: 460px;
    padding: 36px 28px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--card);
  }
  img { width: 84px; height: 84px; object-fit: contain; }
  h1 { margin: 18px 0 8px; font-size: 26px; letter-spacing: -0.02em; }
  p { margin: 0 0 22px; color: var(--muted); line-height: 1.6; font-size: 15px; }
  a.button {
    display: inline-block;
    padding: 12px 22px;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
  }
  code { font-size: 13px; color: var(--muted); }
