# Netlify config for the Kvizo site + signed community data (kvizo.indev.in).
#
# There is nothing to compile. This "build" only collects the files that are meant
# to be public into a publish directory, so the tooling in this repo (build.py,
# the workflows, the stale docs/ copy) never gets uploaded to the CDN.

[build]
  publish = "public"
  command = "mkdir -p public && cp index.html _headers public/ && cp -r assets public/assets && cp manifest.json manifest.json.sig community.json community.json.sig public_key.hex categories.json public/ && cp -r quizzes public/quizzes"

# The landing page is cached for a while and the signed data files stay
# short-lived; those per-path rules live in _headers (copied into public/ above).
