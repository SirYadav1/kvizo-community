name: Deploy to Cloudflare Pages

# The site is a plain static bundle: index.html + assets + the signed community data.
# Every push to master publishes it to https://kvizo.indevs.in
# (Cloudflare Pages project "kvizo-site", see README).
#
# The signed files are produced by validate-and-sign.yml, which commits them back to this
# branch. This job waits for that commit to land, then re-checks the signature before uploading.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for the signing workflow to land its commit
        # validate-and-sign runs in parallel and pushes a "[skip ci]" commit.
        # Without this wait we verify against the pre-signing manifest and fail.
        run: |
          pip install cryptography --quiet
          echo "waiting for manifest hashes to match on-disk quizzes..."
          for i in $(seq 1 30); do
            if python3 build.py --verify-only 2>/dev/null; then
              echo "signed bundle verified after ${i} attempt(s)"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::manifest still stale after 5 minutes - signing workflow may be broken"
              exit 1
            fi
            echo "attempt $i: not signed yet, pulling latest and retrying in 10s"
            git pull --rebase origin master 2>/dev/null || true
            sleep 10
          done

      - name: Assemble the publish directory
        run: |
          set -euo pipefail
          rm -rf public && mkdir -p public
          cp index.html 404.html _headers public/
          cp -r assets public/assets
          cp manifest.json manifest.json.sig community.json community.json.sig \
             public_key.hex categories.json public/
          cp -r quizzes public/quizzes
          echo "publishing $(find public -type f | wc -l) files"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4 pages deploy public
          --project-name=kvizo-site
          --branch=master
          --commit-dirty=true
